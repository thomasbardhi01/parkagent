# Lives at the repo root rather than server/ because the Docker build context
# must be the repo root for the pnpm workspace lockfile. Deploy from here.

app = 'parkagent-api'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  # DRY_RUN, DATABASE_URL, STRIPE_* and SOCRATA_APP_TOKEN come from
  # `fly secrets set`, never from this file.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
