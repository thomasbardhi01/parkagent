# Nightly functional-requirements run (docs/functional-requirements.md):
# the executor fixture suite plus the live FR suite against prod, in dry
# run, as the dedicated FR user. Tue–Sat ~5:17am Eastern so the
# "yesterday afternoon" pricing fixtures always land on a Mon–Fri
# enforcement day and outside enforcement hours (the ts-clamp test needs
# that). On failure one "Nightly FR failures" issue is opened or updated;
# a green run closes it.
#
# Secrets:
#   FR_API_KEY — api key of the DEDICATED FR user on prod
#                (pnpm -C server create:fr-user against the prod DB).
#   FLY_API_TOKEN — (optional; CI's deploy token) lets the run mint FR-32's
#                throwaway session inside the prod machine. Without it, or
#                if minting fails, those four tests skip; nothing goes red.
# The report artifact and the issue use the built-in GITHUB_TOKEN.

name: nightly-fr

on:
  schedule:
    - cron: "17 9 * * 2-6"
  workflow_dispatch:
    inputs:
      base:
        description: "API base URL (default prod)"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-fr
  cancel-in-progress: false

jobs:
  fr:
    runs-on: ubuntu-latest
    env:
      FR_API_BASE: ${{ inputs.base || 'https://parkagent-api.fly.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The executor flows (start / extend / stop / error classification)
      # are exercised from recorded fixture HTML — no browser ever touches
      # a provider. Chromium is only for the DOM-parsing tests.
      - name: Executor fixture suite
        id: executor
        run: |
          pnpm -C executor exec playwright install --with-deps chromium
          pnpm -C executor test

      # Which build the suite is about to test. A run dispatched right
      # after a merge tests the PREVIOUS deploy until CI's deploy job lands
      # (nightly 36015007755 did exactly that), so the report says so.
      - name: Deployed build
        id: deployed
        if: always() && steps.executor.conclusion != 'cancelled'
        run: |
          commit=$(curl -fsS --max-time 20 "$FR_API_BASE/health" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).commit' 2>/dev/null \
            || echo unknown)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$commit" = unknown ]; then
            echo "::warning::couldn't read the deployed commit from $FR_API_BASE/health"
          elif [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::warning::$FR_API_BASE runs $commit, not this run's $GITHUB_SHA — its deploy hasn't landed"
          fi

      # FR-32's session-lifecycle tests (rotation, reuse detection, DELETE
      # /me) need a real refresh session. Without a real Apple or email
      # sign-in the only way to mint one is an admin script run where
      # prod's own DB and JWT secret live — never an API route, so there
      # is no sign-in backdoor. The suite deletes the throwaway it gets.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: always() && steps.executor.conclusion != 'cancelled' && env.FR_API_BASE == 'https://parkagent-api.fly.dev'
        continue-on-error: true
      - name: Mint the FR-32 throwaway session
        if: always() && steps.executor.conclusion != 'cancelled' && env.FR_API_BASE == 'https://parkagent-api.fly.dev'
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not set; FR-32 session tests will skip"
            exit 0
          fi
          line=$(flyctl ssh console -a parkagent-api \
            -C "node dist/scripts/create-fr-throwaway.js" 2>/dev/null \
            | grep '^{"userId"' | tail -1 || true)
          if [ -z "$line" ]; then
            echo "::warning::couldn't mint the FR-32 throwaway; its session tests will skip"
            exit 0
          fi
          # Mask before anything could print them (an assertion diff).
          for field in refreshToken accessToken; do
            echo "::add-mask::$(node -pe "JSON.parse(process.argv[1]).$field" "$line")"
          done
          echo "FR_THROWAWAY_SESSION=$line" >> "$GITHUB_ENV"

      - name: FR suite against the live API (dry run)
        id: frsuite
        if: always() && steps.executor.conclusion != 'cancelled'
        env:
          FR_API_KEY: ${{ secrets.FR_API_KEY }}
          # Relative to server/; see vitest.fr.config.ts for why this is
          # an env var and not --reporter flags.
          FR_REPORT_JSON: fr-report.json
        run: pnpm -C server test:fr

      - name: Build report
        id: report
        if: always()
        env:
          FR_DEPLOYED_COMMIT: ${{ steps.deployed.outputs.commit }}
          FR_TESTS_COMMIT: ${{ github.sha }}
        run: |
          cd server
          node fr/report.mjs fr-report.json fr-summary.md
          cat fr-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'digest<<EOF'
            node fr/report.mjs fr-report.json /dev/null
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fr-report
          path: |
            server/fr-report.json
            server/fr-summary.md
          if-no-files-found: warn

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.report.outputs.digest }}
        run: |
          title="Nightly FR failures"
          body="Nightly FR run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ${DIGEST}

          (Executor fixture step: ${{ steps.executor.conclusion }}; FR suite step: ${{ steps.frsuite.conclusion }}. Report artifact \`fr-report\` on the run has details. This issue is managed by the nightly-fr workflow — it closes itself on the next green run.)"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq '[.[] | select(.title == "Nightly FR failures")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the failure issue on green
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly FR failures"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq '[.[] | select(.title == "Nightly FR failures")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Nightly FR run is green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
