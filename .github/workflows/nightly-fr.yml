# Nightly functional-requirements run (docs/functional-requirements.md):
# the executor fixture suite plus the live FR suite against prod, in dry
# run. Every FR file runs as its own throwaway user, minted here, and the
# suite runs shuffled (vitest.fr.config.ts). Tue–Sat ~5:17am Eastern so the
# "yesterday afternoon" pricing fixtures always land on a Mon–Fri
# enforcement day and outside enforcement hours (the ts-clamp test needs
# that). On failure one "Nightly FR failures" issue is opened or updated;
# a green run closes it.
#
# Secrets:
#   FR_API_KEY — api key of the DEDICATED FR user on prod
#                (pnpm -C server create:fr-user against the prod DB): the
#                gate, the admin routes, and a read-only observer.
#   FLY_API_TOKEN — CI's deploy token. Mints the throwaway users inside the
#                prod machine, and purges any a run left behind. It stays in
#                those two steps; the suite only ever sees the minted
#                sessions. Without it the suite can't run (every file fails
#                saying there is no throwaway pool). A non-prod `base` needs its own
#                pool the same way; this workflow mints only on prod.
# The report artifact and the issue use the built-in GITHUB_TOKEN.

name: nightly-fr

on:
  schedule:
    - cron: "17 9 * * 2-6"
  workflow_dispatch:
    inputs:
      base:
        description: "API base URL (default prod)"
        required: false
      seed:
        description: "Shuffle seed to replay a run's order (its report names it)"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-fr
  cancel-in-progress: false

jobs:
  fr:
    runs-on: ubuntu-latest
    env:
      FR_API_BASE: ${{ inputs.base || 'https://parkagent-api.fly.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The executor flows (start / extend / stop / error classification)
      # are exercised from recorded fixture HTML — no browser ever touches
      # a provider. Chromium is only for the DOM-parsing tests.
      - name: Executor fixture suite
        id: executor
        run: |
          pnpm -C executor exec playwright install --with-deps chromium
          pnpm -C executor test

      # Which build the suite is about to test. A run dispatched right
      # after a merge tests the PREVIOUS deploy until CI's deploy job lands
      # (nightly 36015007755 did exactly that), so the report says so.
      - name: Deployed build
        id: deployed
        if: always() && steps.executor.conclusion != 'cancelled'
        run: |
          commit=$(curl -fsS --max-time 20 "$FR_API_BASE/health" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).commit' 2>/dev/null \
            || echo unknown)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$commit" = unknown ]; then
            echo "::warning::couldn't read the deployed commit from $FR_API_BASE/health"
          elif [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::warning::$FR_API_BASE runs $commit, not this run's $GITHUB_SHA — its deploy hasn't landed"
          fi

      # Every FR file runs as its own throwaway user (server/fr/pool.mjs
      # names them). Without a real Apple or email sign-in the only way to
      # mint a session is an admin script run where prod's own DB and JWT
      # secret live — never an API route, so there is no sign-in backdoor.
      # Each file deletes its users when its tests end.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08: node24 (its last release, 1.5, is node20)
        if: always() && steps.executor.conclusion != 'cancelled' && env.FR_API_BASE == 'https://parkagent-api.fly.dev'
      - name: Mint the FR throwaway users
        if: always() && steps.executor.conclusion != 'cancelled' && env.FR_API_BASE == 'https://parkagent-api.fly.dev'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN not set; the FR suite can't mint its throwaway users"
            exit 1
          fi
          labels=$(node server/fr/pool.mjs)
          # The labels ride the remote command line: plain names only.
          if ! printf '%s' "$labels" | grep -Eq '^[a-z0-9.,-]+$'; then
            echo "::error::unexpected pool labels: $labels"
            exit 1
          fi
          # The pool goes into a file only this job can read; later steps get
          # its path. (An env var's value is printed in every later step's
          # log header: masked tokens, but user and device ids in clear.)
          pool_file="$RUNNER_TEMP/fr-pool.json"
          umask 077
          for _ in 1 2; do
            flyctl ssh console -a parkagent-api \
              -C "node dist/scripts/create-fr-throwaway.js --pool $labels" 2>/dev/null \
              | grep '^{' | tail -1 > "$pool_file" || true
            if [ -s "$pool_file" ]; then break; fi
            sleep 15
          done
          if [ ! -s "$pool_file" ]; then
            echo "::error::couldn't mint the FR throwaway users"
            exit 1
          fi
          # Mask every token before anything could print one (an assertion diff).
          # shellcheck disable=SC2016 # JS template literals, not shell
          POOL_FILE="$pool_file" node -e '
            const pool = JSON.parse(require("fs").readFileSync(process.env.POOL_FILE, "utf8"));
            for (const u of Object.values(pool)) {
              console.log(`::add-mask::${u.accessToken}`);
              console.log(`::add-mask::${u.refreshToken}`);
            }'
          echo "FR_THROWAWAY_POOL_FILE=$pool_file" >> "$GITHUB_ENV"

      # The order every file and test runs in; the report names it, and the
      # `seed` input replays it.
      - name: Shuffle seed
        id: seed
        if: always() && steps.executor.conclusion != 'cancelled'
        env:
          SEED: ${{ inputs.seed }}
        run: |
          if [ -z "$SEED" ]; then SEED=$(node -p 'Math.floor(Math.random() * 2 ** 31)'); fi
          # The whole value, digits only: it lands in $GITHUB_OUTPUT.
          case "$SEED" in
            "" | *[!0-9]*)
              echo "::error::seed must be a whole number"
              exit 1
              ;;
          esac
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"

      - name: FR suite against the live API (dry run)
        id: frsuite
        if: always() && steps.executor.conclusion != 'cancelled'
        env:
          FR_API_KEY: ${{ secrets.FR_API_KEY }}
          # Relative to server/; see vitest.fr.config.ts for why this is
          # an env var and not --reporter flags.
          FR_REPORT_JSON: fr-report.json
          FR_SEED: ${{ steps.seed.outputs.seed }}
        run: pnpm -C server test:fr

      # Each file deletes its throwaways however its tests end; this catches
      # what it can't — a run that died first, or a throwaway whose tokens
      # were already dead. Same teardown as DELETE /me, run where the
      # minting ran; only rows create-fr-throwaway minted are ever touched
      # (see services/frThrowaways.ts). --include lifts the 30-minute age
      # gate for THIS run's throwaways, which are minutes old; older strays
      # from earlier runs are swept too. Never turns the run red.
      - name: Purge FR throwaways
        if: always() && steps.executor.conclusion != 'cancelled' && env.FR_API_BASE == 'https://parkagent-api.fly.dev'
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN not set; nothing was minted, nothing to purge"
            exit 0
          fi
          include=""
          ids=""
          if [ -s "${FR_THROWAWAY_POOL_FILE:-}" ]; then
            ids=$(node -p 'Object.values(JSON.parse(require("fs").readFileSync(process.env.FR_THROWAWAY_POOL_FILE, "utf8"))).map((u) => u.userId).join(" ")')
          fi
          for id in $ids; do
            # A cuid; anything else never reaches the remote command line.
            if printf '%s' "$id" | grep -Eq '^[a-z0-9]+$'; then include="$include --include $id"; fi
          done
          flyctl ssh console -a parkagent-api \
            -C "node dist/scripts/purge-fr-throwaways.js --apply$include" 2>/dev/null \
            | grep -E '^(delete|clear_sessions|needs_manual|not_a_throwaway|too_fresh) |^\{"purge"' \
            || echo "::warning::purge-fr-throwaways produced no summary; check the machine"

      - name: Build report
        id: report
        if: always()
        env:
          FR_DEPLOYED_COMMIT: ${{ steps.deployed.outputs.commit }}
          FR_TESTS_COMMIT: ${{ github.sha }}
          FR_SEED: ${{ steps.seed.outputs.seed }}
        run: |
          cd server
          node fr/report.mjs fr-report.json fr-summary.md
          cat fr-summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'digest<<EOF'
            node fr/report.mjs fr-report.json /dev/null
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fr-report
          path: |
            server/fr-report.json
            server/fr-summary.md
          if-no-files-found: warn

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.report.outputs.digest }}
        run: |
          title="Nightly FR failures"
          body="Nightly FR run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ${DIGEST}

          (Executor fixture step: ${{ steps.executor.conclusion }}; FR suite step: ${{ steps.frsuite.conclusion }}. Report artifact \`fr-report\` on the run has details. This issue is managed by the nightly-fr workflow — it closes itself on the next green run.)"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq '[.[] | select(.title == "Nightly FR failures")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Close the failure issue on green
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly FR failures"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq '[.[] | select(.title == "Nightly FR failures")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Nightly FR run is green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
