version: 2
updates:
  # Third-party actions are pinned to a commit SHA with a version comment
  # (scripts/check-action-pins.sh enforces it). Dependabot moves a pin to
  # the newest release's SHA and rewrites the comment with it; a pin with no
  # release (setup-flyctl on master) follows its branch's head commit. One
  # weekly PR for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # npm: minors and patches only. A major gets handled deliberately, in its own
  # PR, after reading its breaking changes against our code (as dotenv 18 was
  # in #159). This covers the deliberate pins too; see "Pinned versions" in
  # CLAUDE.md (prisma 7, typescript 6). `ignore` applies to version updates
  # only, so a security update that needs a major still comes through.
  #
  # These jobs run per package directory and leave the root pnpm-lock.yaml
  # stale; .github/workflows/dependabot-lockfile.yml regenerates it on the PR.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /executor
    schedule:
      interval: weekly
    groups:
      executor-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
