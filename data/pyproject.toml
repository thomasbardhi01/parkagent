[project]
name = "data"
version = "0.1.0"
description = "ParkAgent data: fetch NYC Open Data and build zones.geojson"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0.1",
    "requests>=2.32.5",
    "shapely>=2.0.7",
]

# No [build-system]: this is a folder of scripts run with `uv run data/<script>.py`,
# not a distributable package.
