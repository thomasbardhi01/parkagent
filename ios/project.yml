name: ParkAgent

# Single source of truth for the Xcode project. Never hand-edit ParkAgent.xcodeproj;
# edit this file and run `xcodegen generate` in ios/.
# Info.plist and ParkAgent.entitlements are GENERATED from this file and are
# gitignored — declare keys here, not in the plists.

options:
  bundleIdPrefix: com.thomasbardhi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  # Apple Pay + PaymentSheet confirmation of the SetupIntent that saves the
  # ParkAgent card's funding card (see StripeWallet.swift — the only file
  # that imports it).
  StripeiOS:
    url: https://github.com/stripe/stripe-ios
    from: "24.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Config.xcconfig (see Config.example.xcconfig).
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

targets:
  ParkAgent:
    type: application
    platform: iOS
    sources:
      - path: ParkAgent
        excludes:
          - "Info.plist"
          - "ParkAgent.entitlements"

    dependencies:
      - package: StripeiOS
        product: StripeApplePay
      - package: StripeiOS
        product: StripePaymentSheet

    info:
      path: ParkAgent/Info.plist
      properties:
        # Surfaced from Config.xcconfig so the app can point at localhost, Fly,
        # or a teammate's machine without a code change. Read via AppConfig.
        # There is no API_KEY any more: the app authenticates as the
        # signed-in user with a JWT from the Keychain (see AuthStore).
        API_BASE_URL: $(API_BASE_URL)
        STRIPE_PUBLISHABLE_KEY: $(STRIPE_PUBLISHABLE_KEY)

        CFBundleDisplayName: ParkAgent
        # 1.0.0 (MARKETING_VERSION below); the build number is
        # CURRENT_PROJECT_VERSION, which the TestFlight workflow sets to its
        # run number (.github/workflows/testflight.yml).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # HTTPS only, through the system's own TLS — exempt, so no export
        # compliance questions on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # The app's background color, so a dark-mode launch never flashes
        # white before the first frame.
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        # Apple reviews these strings and users see them verbatim: plain
        # English, what it's for, nothing more.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          ParkAgent uses your location in the background to notice when you
          have parked, even when the app is closed. It uses where you parked
          to find the meter zone and its rate. Your location is only used for
          parking, never for ads.
        NSLocationWhenInUseUsageDescription: >-
          ParkAgent uses your location to show the meters around you and find
          the zone you parked in.
        NSMotionUsageDescription: >-
          ParkAgent uses motion activity to tell when you have stopped
          driving, so it only offers to pay once you have actually parked.
        NSFaceIDUsageDescription: >-
          ParkAgent asks for Face ID before showing a full card number, so
          only you can see it.
        NSSpeechRecognitionUsageDescription: >-
          ParkAgent turns what you say to the parking assistant into text, on
          your iPhone when it can, so you can ask for parking without typing.
        NSMicrophoneUsageDescription: >-
          ParkAgent listens only after you tap the assistant's microphone
          button, to hear your parking question.

        # parkagent:// deep links: tap-to-pay pushes, assistant, the Link
        # wallet OAuth bounce-back.
        CFBundleURLTypes:
          - CFBundleURLName: com.thomasbardhi.parkagent
            CFBundleURLSchemes: [parkagent]

        # Background location is the whole unattended-park loop. Nothing
        # else runs in the background: pushes are plain alerts (no silent
        # pushes), and there are no BGTaskScheduler tasks — a declared mode
        # with no use is an App Review rejection, and `processing` without
        # BGTaskSchedulerPermittedIdentifiers fails the upload itself.
        UIBackgroundModes:
          - location

    entitlements:
      path: ParkAgent/ParkAgent.entitlements
      properties:
        # Xcode rewrites this to "production" when it signs an App Store
        # export (TestFlight). The app reads the environment its token came
        # from off its own signing (Support/APNsEnvironment.swift) and the
        # server pushes each token to the matching APNs host.
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # Sign in with Apple — the welcome screen's primary action. Also
        # needs the capability enabled on the App ID in the Apple Developer
        # portal (see the PR checklist).
        com.apple.developer.applesignin:
          - Default
        # Apple Pay saves the ParkAgent card's funding card (see API.md
        # "Apple Pay setup" for the one-time merchant-ID + Stripe
        # certificate dance).
        com.apple.developer.in-app-payments:
          - merchant.com.thomasbardhi.parkagent

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasbardhi.parkagent
        PRODUCT_NAME: ParkAgent
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

  ParkAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkAgentTests
      # Proves the Release denylist's type entries are real names (see
      # ReleaseDenylistTests).
      - path: Tools/ReleaseDenylist.swift
      - path: Tools/release-denylist.txt
        buildPhase: resources
    dependencies:
      - target: ParkAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasbardhi.parkagent.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ParkAgent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ParkAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  # Runs INSIDE the Release build (scheme ParkAgentRelease): proves the
  # shipping binary carries no mock, scenario, or Diagnostics code and none
  # of the dev strings in Tools/release-denylist.txt. No @testable import —
  # a Release build isn't testable, which is the point.
  ParkAgentReleaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkAgentReleaseTests
      - path: Tools/ReleaseDenylist.swift
      - path: Tools/release-denylist.txt
        buildPhase: resources
    dependencies:
      - target: ParkAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasbardhi.parkagent.releasetests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ParkAgent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ParkAgent"
        GENERATE_INFOPLIST_FILE: YES

  ParkAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkAgentUITests
    dependencies:
      - target: ParkAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasbardhi.parkagent.uitests
        TEST_TARGET_NAME: ParkAgent
        GENERATE_INFOPLIST_FILE: YES

# Explicit scheme so `xcodebuild test` works headlessly (CI has no Xcode UI to
# auto-create one).
schemes:
  ParkAgent:
    build:
      targets:
        ParkAgent: all
        ParkAgentTests: [test]
        ParkAgentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ParkAgentTests
        - ParkAgentUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The Release binary's own checks (ParkAgentReleaseTests), in the Release
  # configuration: `xcodebuild -scheme ParkAgentRelease test`.
  ParkAgentRelease:
    build:
      targets:
        ParkAgent: all
        ParkAgentReleaseTests: [test]
    run:
      config: Release
    test:
      config: Release
      targets:
        - ParkAgentReleaseTests
