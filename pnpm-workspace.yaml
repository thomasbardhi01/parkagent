packages:
  - server
  - executor
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  prisma: true
  workerd: false
# Patched versions of prisma's transitive dependencies, until prisma ships
# them. Each applies only to the vulnerable range, so it goes quiet on its
# own once upstream moves past it. The audit workflow (scripts/audit.mjs)
# is what would catch a new one.
#   lodash       GHSA-r5fr-rjxr-66jc, GHSA-f23m-r3pf-42rh, GHSA-xxjr-mmjv-4gpg
#                (via @prisma/studio-core's @visx charts)
#   deepmerge-ts GHSA-ggr8-5vv4-36mx (via @prisma/config, which pins 7.1.5;
#                8.x's breaking changes are deepmergeInto and type names, and
#                @prisma/config only calls deepmerge())
#   mysql2       GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3 (a prisma CLI
#                dependency; we run PostgreSQL)
overrides:
  "lodash@<4.18.1": "^4.18.1"
  "deepmerge-ts@<8.0.0": "^8.0.2"
  "mysql2@<3.23.1": "^3.23.1"
