name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The app runs in more than one city: user-facing copy must take city and
  # provider names from the provider registry, never hardcode one.
  city-neutral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-city-neutral.sh

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C server lint
      - run: pnpm -C server test
      # Compile-only here: the server's tsc needs executor/dist type
      # declarations. The executor's own unit tests run in the `executor`
      # job below (with Chromium for the DOM test).
      - run: pnpm -C executor run build
      # `build` runs `prisma generate` first (src/generated is gitignored).
      # generate never connects, but prisma7.config.ts wants a URL present.
      - run: pnpm -C server build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  # The server tests build the app through buildApp() with fakes and never
  # run index.ts, so a boot that throws before listen (#130's crash loop)
  # passes them. This boots the real `node dist/index.js` against a migrated
  # PostGIS three times — every optional feature off, every one on with
  # dummy but well-formed values, and every one misconfigured (which must
  # still boot: the 2026-09-26 outage) — and deploy waits on it. See
  # scripts/boot-check.sh.
  boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # The image runs node:24-slim; boot on the same major.
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C executor run build
      - run: pnpm -C server build
      # What fly.toml's release_command runs before a deploy takes traffic.
      - run: pnpm -C server exec prisma migrate deploy
      - run: scripts/boot-check.sh off
      - run: scripts/boot-check.sh on
      - run: scripts/boot-check.sh broken

  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # playwright's browser download is blocked by allowBuilds, so fetch
      # Chromium (+ its OS deps) explicitly; the signage-modal DOM test
      # launches it and self-skips where it is absent.
      - run: pnpm -C executor exec playwright install --with-deps chromium
      - run: pnpm -C executor lint
      - run: pnpm -C executor test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The .xcodeproj is gitignored and generated from ios/project.yml.
      # Caching Homebrew's download cache spares the bottle fetch on a warm
      # run; the pour itself is quick. (Nothing in CI downloads Chromium:
      # playwright's postinstall is blocked by allowBuilds and no job runs
      # `playwright install` — revisit when Phase 5 adds executor tests.)
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-${{ runner.os }}-xcodegen
      - run: brew install xcodegen
      # Config.xcconfig is gitignored; the example supplies an empty
      # DEVELOPMENT_TEAM, which is all an unsigned simulator build needs.
      - run: cp ios/Config.example.xcconfig ios/Config.xcconfig
      - run: xcodegen generate
        working-directory: ios
      - run: xcodebuild -project ios/ParkAgent.xcodeproj -scheme ParkAgent -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      # The Release build is what TestFlight ships: it must carry no mock,
      # scenario, or Diagnostics code (FR-34). ParkAgentReleaseTests runs
      # inside the Release build and checks its own binary; the script
      # runs `strings` over it with the same denylist.
      - id: sim
        run: |
          DEVICE="iPhone 17 Pro Max"
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then
            DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          fi
          UDID=$(xcrun simctl list devices available | grep -F "$DEVICE (" | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE ($UDID)"
      # The unit tests gate here (the ui-tests job may fail without
      # blocking). ReleaseDenylistTests among them proves every type the
      # Release check says is absent really exists in Debug, so that
      # absence can't pass vacuously.
      - name: Unit tests (Debug)
        run: >
          xcodebuild -project ios/ParkAgent.xcodeproj -scheme ParkAgent
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build-debug
          -only-testing:ParkAgentTests
          test CODE_SIGNING_ALLOWED=NO
      - name: Release binary tests (ParkAgentRelease)
        run: >
          xcodebuild -project ios/ParkAgent.xcodeproj -scheme ParkAgentRelease
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build-release
          test CODE_SIGNING_ALLOWED=NO
      - name: No dev strings in the Release binary
        run: ios/Tools/check-release-binary.sh build-release/Build/Products/Release-iphonesimulator/ParkAgent.app

  ui-tests:
    runs-on: macos-latest
    # Simulator boot on hosted runners is historically flaky (and the device
    # roster shifts with the Xcode image), so a red run here doesn't block the
    # PR yet. Revisit once a few weeks of runs look stable.
    continue-on-error: true
    # issues: the flaky-test issues below.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-${{ runner.os }}-xcodegen
      - run: brew install xcodegen
      - run: cp ios/Config.example.xcconfig ios/Config.xcconfig
      - run: xcodegen generate
        working-directory: ios
      # Fall back to any iPhone the image ships if the preferred device is
      # missing, rather than hard-failing on the name. Everything after
      # this pins the device by UDID, so boot, install, and test all hit
      # the same simulator.
      - id: sim
        run: |
          DEVICE="iPhone 17 Pro Max"
          if ! xcrun simctl list devices available | grep -q "$DEVICE ("; then
            DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | sed 's/ *$//')
          fi
          UDID=$(xcrun simctl list devices available | grep -F "$DEVICE (" | head -1 | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE ($UDID)"
      - run: >
          xcodebuild -project ios/ParkAgent.xcodeproj -scheme ParkAgent
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build
          build-for-testing CODE_SIGNING_ALLOWED=NO
      # Warm-up: a cold simulator's first boot and first app launch (dyld
      # caches, SpringBoard, the first accessibility snapshot) take longer
      # than a UI test's first wait, so the suite's first few tests used
      # to fail on launch alone. Boot the device and launch the built app
      # once, off the clock, before the suite starts.
      - name: Warm up the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -maxdepth 2 -type d -name 'ParkAgent.app' -path '*iphonesimulator*' | head -1)
          echo "Installing $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.thomasbardhi.parkagent -uiTesting YES -useMockAPI YES -resetState YES
          sleep 20
          xcrun simctl terminate "$UDID" com.thomasbardhi.parkagent || true
      # A failed test runs once more; one that passes on that retry passes
      # the run, and is reported as flaky below — a retry is never silent.
      - run: >
          xcodebuild -project ios/ParkAgent.xcodeproj -scheme ParkAgent
          -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath build
          -resultBundlePath TestResults.xcresult
          -retry-tests-on-failure -test-iterations 2
          test-without-building CODE_SIGNING_ALLOWED=NO
      # The xcresult bundle carries the XCTAttachment screenshots from the
      # snapshot tests, and each failed attempt's screenshot and hierarchy.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-results
          path: TestResults.xcresult
      - name: Tests that needed a retry
        id: flaky
        if: always()
        run: |
          node --test ios/Tools/flaky-tests.test.mjs
          if [ ! -d TestResults.xcresult ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact > xcresult-tests.json
          node ios/Tools/flaky-tests.mjs xcresult-tests.json > flaky.jsonl
          count=$(wc -l < flaky.jsonl | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## UI tests that passed only on a retry: $count"
            # shellcheck disable=SC2016 # JS template literals, not shell
            node -e 'for (const l of require("fs").readFileSync("flaky.jsonl", "utf8").split("\n").filter(Boolean)) { const f = JSON.parse(l); console.log(`- \`${f.id}\` — first attempt: ${f.failure}`); }'
          } >> "$GITHUB_STEP_SUMMARY"
      # One "Flaky UI test: <id>" issue per test: opened the first time,
      # commented (and reopened if closed) every time it needs a retry again.
      # Dependabot's runs get a read-only token; their flakes stay in the
      # summary above.
      - name: Open or update flaky-test issues
        if: always() && steps.flaky.outputs.count != '' && steps.flaky.outputs.count != '0' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh label create flaky-test --color FBCA04 \
            --description "A test that passed only on a retry" 2>/dev/null || true
          while IFS= read -r line; do
            id=$(node -pe 'JSON.parse(process.argv[1]).id' "$line")
            failure=$(node -pe 'JSON.parse(process.argv[1]).failure' "$line")
            export TITLE="Flaky UI test: $id"
            seen="Needed a retry in $RUN_URL ($REF @ ${SHA:0:7}). First attempt: \`$failure\`"
            found=$(gh issue list --state all --label flaky-test --limit 200 --json number,title,state \
              --jq '[.[] | select(.title == env.TITLE)][0] | select(. != null) | "\(.number) \(.state)"')
            if [ -z "$found" ]; then
              gh issue create --title "$TITLE" --label flaky-test --body "$seen

          \`$id\` failed and then passed on CI's one retry (\`-retry-tests-on-failure -test-iterations 2\` in ci.yml's ui-tests job). The run's \`ui-test-results\` artifact holds the failed attempt's screenshot and UI hierarchy (\`xcrun xcresulttool export attachments --test-id '$id'\`). This issue is updated each time the test needs a retry again; close it once it's fixed."
            else
              number=${found%% *}
              state=${found#* }
              if [ "$state" = "CLOSED" ]; then gh issue reopen "$number"; fi
              gh issue comment "$number" --body "$seen"
            fi
          done < flaky.jsonl

  deploy:
    # Merging to main deploys; nobody needs the Fly token locally.
    needs: [server, boot, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-parkagent-api
      cancel-in-progress: false
    # The secrets context is not available in a job-level `if`, so the token is
    # read into the job env and checked in a step instead. Until FLY_API_TOKEN
    # exists as a repo secret, this job no-ops and stays green rather than
    # turning main red.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - id: token
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set; skipping deploy. Create it with 'fly tokens create deploy'."
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-04-08: node24 (its last release, 1.5, is node20)
        if: steps.token.outputs.present == 'true'
      - run: >
          flyctl deploy --remote-only
          --build-arg GIT_SHA=${GITHUB_SHA}
          --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        if: steps.token.outputs.present == 'true'
