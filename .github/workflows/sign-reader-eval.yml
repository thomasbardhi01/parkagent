# The parking-sign reader's live eval (Issue N): the golden set's sign
# texts through the real model, grounded and compared as the route does.
# Manual only: it spends a few cents of model time per run. CI's server
# job runs the same set on hand-written model outputs (test/signReader.test.ts).
name: sign-reader-eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C executor run build
      - run: pnpm -C server exec prisma generate
      - name: Live model over the golden set
        run: pnpm -C server sign:eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
