# Lives at the repo root rather than server/ because the Docker build context
# must be the repo root for the pnpm workspace lockfile. Deploy from here.

app = 'parkagent-api'
primary_region = 'ewr'

# Graceful shutdown (server/src/services/shutdown.ts): on SIGTERM the server
# stops taking requests, lets payments in flight finish, then closes the
# browser and the database within 25 s. Fly's default (SIGINT, 5 s) would
# SIGKILL a payment mid-flight.
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  # DRY_RUN, DATABASE_URL, STRIPE_* and SOCRATA_APP_TOKEN come from
  # `fly secrets set`, never from this file.

[deploy]
  # Apply pending Prisma migrations before the new version takes traffic.
  # Runs in a one-off machine from the image (WORKDIR /app/server); the bin
  # path avoids depending on corepack fetching pnpm at release time.
  release_command = './node_modules/.bin/prisma migrate deploy'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm: park detection can't wait out a cold start.
  min_machines_running = 1
  processes = ['app']

  # Readiness, not just liveness: /health/ready pings the database, so a
  # machine that can't reach it stops getting traffic (and a deploy that
  # can't isn't marked healthy). /health stays for build identity.
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health/ready'

# Machine size lives here, not in `fly scale`: every `fly deploy` (rollbacks
# included) re-applies this block and undoes `fly scale memory`/`fly scale vm`.
# 1 GB because paying runs the executor's headless Chromium on this machine.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
