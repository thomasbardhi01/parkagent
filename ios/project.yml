name: ParkAgent

# Single source of truth for the Xcode project. Never hand-edit ParkAgent.xcodeproj;
# edit this file and run `xcodegen generate` in ios/.
# Info.plist and ParkAgent.entitlements are GENERATED from this file and are
# gitignored — declare keys here, not in the plists.

options:
  bundleIdPrefix: com.thomasbardhi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  # Apple Pay + card-form confirmation of top-up PaymentIntents
  # (see StripeTopup.swift — the only file that imports it).
  StripeiOS:
    url: https://github.com/stripe/stripe-ios
    from: "24.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Config.xcconfig (see Config.example.xcconfig).
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

targets:
  ParkAgent:
    type: application
    platform: iOS
    sources:
      - path: ParkAgent
        excludes:
          - "Info.plist"
          - "ParkAgent.entitlements"

    dependencies:
      - package: StripeiOS
        product: StripeApplePay
      - package: StripeiOS
        product: StripePaymentSheet

    info:
      path: ParkAgent/Info.plist
      properties:
        # Surfaced from Config.xcconfig so the app can point at localhost, Fly,
        # or a teammate's machine without a code change. Read via AppConfig.
        # There is no API_KEY any more: the app authenticates as the
        # signed-in user with a JWT from the Keychain (see AuthStore).
        API_BASE_URL: $(API_BASE_URL)
        STRIPE_PUBLISHABLE_KEY: $(STRIPE_PUBLISHABLE_KEY)

        CFBundleDisplayName: ParkAgent
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        # Apple reviews these strings and users see them verbatim.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          ParkAgent needs your location in the background to notice when you have
          parked and to find the right meter zone, so it can pay before the meter
          starts running.
        NSLocationWhenInUseUsageDescription: >-
          ParkAgent uses your location to find the meter zone you parked in and
          quote the correct rate.
        NSMotionUsageDescription: >-
          ParkAgent uses motion activity to tell driving from walking, so it only
          starts a parking session once you have actually parked and left the car.
        NSFaceIDUsageDescription: >-
          ParkAgent asks for Face ID before revealing your full card number, so
          only you can see it.
        NSSpeechRecognitionUsageDescription: >-
          ParkAgent transcribes what you say to the parking assistant, on this
          device when it can, so you can ask for a spot without typing.
        NSMicrophoneUsageDescription: >-
          ParkAgent listens only while you hold the assistant's mic button, to
          hear your parking question.

        # parkagent:// deep links: tap-to-pay pushes, assistant, the Link
        # wallet OAuth bounce-back.
        CFBundleURLTypes:
          - CFBundleURLName: com.thomasbardhi.parkagent
            CFBundleURLSchemes: [parkagent]

        UIBackgroundModes:
          - location
          - remote-notification
          - processing

    entitlements:
      path: ParkAgent/ParkAgent.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # Sign in with Apple — the welcome screen's primary action. Also
        # needs the capability enabled on the App ID in the Apple Developer
        # portal (see the PR checklist).
        com.apple.developer.applesignin:
          - Default
        # Apple Pay top-ups (see API.md "Apple Pay setup" for the one-time
        # merchant-ID + Stripe certificate dance).
        com.apple.developer.in-app-payments:
          - merchant.com.thomasbardhi.parkagent

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasbardhi.parkagent
        PRODUCT_NAME: ParkAgent
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

  ParkAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkAgentTests
    dependencies:
      - target: ParkAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasbardhi.parkagent.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ParkAgent.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ParkAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  ParkAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkAgentUITests
    dependencies:
      - target: ParkAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasbardhi.parkagent.uitests
        TEST_TARGET_NAME: ParkAgent
        GENERATE_INFOPLIST_FILE: YES

# Explicit scheme so `xcodebuild test` works headlessly (CI has no Xcode UI to
# auto-create one).
schemes:
  ParkAgent:
    build:
      targets:
        ParkAgent: all
        ParkAgentTests: [test]
        ParkAgentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ParkAgentTests
        - ParkAgentUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
