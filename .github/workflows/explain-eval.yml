# The "why" eval against the model (Issue M): the 30 golden decisions in
# server/src/eval/explainGolden.ts explained through the real capability
# with EXPLAIN_MODEL on, each phrasing held to the facts CI already holds the
# template to (server/test/explainEval.test.ts). It spends real money (30
# short calls on the cheap model, a fraction of a cent each), so it runs only
# by hand: Actions → explain-eval → Run workflow.
#
# Secrets:
#   ANTHROPIC_API_KEY — the same key the audit eval uses. Without it the run
#                       fails at once, saying so.

name: explain-eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "EXPLAIN_MODEL to evaluate (default claude-haiku-5-5)"
        required: false

permissions:
  contents: read

concurrency:
  group: explain-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Explain the golden decisions with the model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXPLAIN_MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}
        run: pnpm -C server explain:eval | tee explain-eval.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '### explain-eval'
            echo '```'
            tail -n 40 explain-eval.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
