version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-deps:
        patterns: ["*"]
    ignore:
      # Deliberately pinned; see "Pinned versions" in CLAUDE.md.
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /executor
    schedule:
      interval: weekly
    groups:
      executor-deps:
        patterns: ["*"]
