<!-- TEST HARNESS, not a recording: the sanitized "Review Signage" popup
     markup from signage-modal.html, plus a synthetic jQuery-Mobile-style
     open — the popup gains ui-popup-active late and fades opacity 0 → 1
     while the .ui-popup-screen overlay fades in with class "in". Timings
     are set by the test via window.__openPopup(delayMs, fadeMs). The click
     handler records the container's computed opacity and whether anything
     was still animating at click time, so the test can assert the handler
     WAITED for the fade (the 2026-09-22 regression clicked mid-fade /
     raced the popup entirely). window.__requireClicks simulates a Continue
     that eats the first click, to exercise the dispatchEvent fallback. -->
<!doctype html><html><head><style>
  /* jQM stacking: the popup container paints ABOVE its screen overlay. */
  #signageContainer { opacity: 0; position: absolute; z-index: 1100; }
  #signageContainer.ui-popup-active { display: block; }
  .ui-popup-screen { opacity: 0; position: fixed; inset: 0; background: #000; z-index: 1099; }
</style></head><body>
<div id="zoneEntryPage" class="ui-page ui-page-active">
  <p>Enter the zone number posted at this location:</p>
  <button id="zoneNext">Continue</button>
</div>

<!-- the Review Signage popup: no id on the jQM container in the real DOM;
     this harness adds one only for the open script, the selectors under
     test still match by class + text -->
<div id="signageContainer" class="ui-popup-container" style="max-width:1250px;top:250px;left:318px;">
  <div data-role="popup" class="ui-popup ui-body-a ui-overlay-shadow ui-corner-all" role="dialog">
    <div data-role="header" class="ui-header ui-bar-a"><h1 class="ui-title">Review Signage</h1></div>
    <div data-role="content" class="ui-content">
      <p>Please be sure to check the signage around you for parking restrictions and meter hours.</p>
      <!-- zero-size duplicate the app leaves in the markup -->
      <button data-role="button" class="submit" style="width:0;height:0;overflow:hidden">Continue</button>
      <!-- the real, rendered Continue -->
      <a href="#" data-role="button" class="ui-btn ui-shadow ui-btn-corner-all ui-btn-up-a"
         style="display:block;width:610px;height:49px">Continue</a>
      <a href="#" data-role="button" class="ui-btn">Cancel</a>
    </div>
  </div>
</div>
<div class="ui-popup-screen ui-overlay-a" style="height:100%;width:100%;display:none"></div>

<script>
  window.__clickState = null;
  window.__clicks = 0;
  window.__requireClicks = 1;

  var container = document.getElementById("signageContainer");
  var screen = document.querySelector(".ui-popup-screen");

  window.__openPopup = function (delayMs, fadeMs) {
    setTimeout(function () {
      container.style.transition = "opacity " + fadeMs + "ms linear";
      screen.style.transition = "opacity " + fadeMs + "ms linear";
      screen.style.display = "block";
      container.classList.add("ui-popup-active");
      screen.classList.add("in");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          container.style.opacity = "1";
          screen.style.opacity = "0.42";
        });
      });
      screen.addEventListener(
        "transitionend",
        function () { screen.classList.remove("in"); },
        { once: true }
      );
    }, delayMs);
  };

  function closePopup() {
    container.classList.remove("ui-popup-active");
    container.style.display = "none";
    screen.style.display = "none";
  }

  // Any Continue inside the popup (the .submit duplicate included) runs
  // the same handler, like the app's delegated binding.
  container.addEventListener("click", function (event) {
    var target = event.target;
    if (!(target && /continue/i.test(target.textContent || ""))) return;
    event.preventDefault();
    window.__clicks += 1;
    var running = container
      .getAnimations({ subtree: true })
      .some(function (a) { return a.playState === "running"; });
    window.__clickState = {
      opacity: getComputedStyle(container).opacity,
      animationsRunning: running,
      active: container.classList.contains("ui-popup-active"),
    };
    if (window.__clicks >= window.__requireClicks) closePopup();
  });
</script>
</body></html>
